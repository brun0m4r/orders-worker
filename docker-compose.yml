services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: orders-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  mongo:
    image: mongo:7
    container_name: orders-mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: orders-redis
    ports:
      - "6379:6379"

  enrichment-api:
    build: ./enrichment-api
    container_name: orders-enrichment-api
    ports:
      - "8081:8081"

  worker:
    build: ./worker
    depends_on:
      - kafka
      - mongo
      - redis
      - enrichment-api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/orders
      REDIS_HOST: redis
      ENRICHMENT_URL: http://enrichment-api:8081
    ports:
      - "8080:8080"
    # Para probar varias instancias: docker compose up --scale worker=3 (quitar "ports")
